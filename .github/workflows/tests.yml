name: Testes

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, zip, bcmath, pdo_sqlite
          coverage: none

      - name: Dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Testes
        run: php artisan test
